openapi: 3.0.3
info:
  title: FixShift API
  version: 0.4.0
  description: |
    Find replacements for shifts when the scheduled worker is unavailable.
    All list endpoints use cursor pagination: `?limit=20&cursor=abc` -> `{ items, nextCursor }`.
servers:
  - url: /api/v1

paths:
  # ---------- Home ----------
  /shifts/current:
    get:
      summary: Workers whose shift is active right now (Home, tab 1)
      parameters: [ { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentShiftPage" }
              example:
                items:
                  - { shiftId: sh_101, workerId: w_1, name: Anna Peeters, role: Barista, endsAt: "2026-10-19T16:00:00Z" }
                nextCursor: null

  /shifts:
    get:
      summary: Shifts in a date range (Home, tab 2 calendar)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to,   in: query, required: true, schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarShiftPage" }
              example:
                items:
                  - { shiftId: sh_101, name: Anna Peeters, startsAt: "2026-10-19T08:00:00Z", endsAt: "2026-10-19T16:00:00Z" }
                nextCursor: null
        "422": { $ref: "#/components/responses/Error" }

  # ---------- Replacements ----------
  /shifts/{shiftId}:
    get:
      summary: Shift header (Replacements page)
      parameters: [ { $ref: "#/components/parameters/ShiftId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShiftDetail" }
              example:
                { shiftId: sh_101, name: Anna Peeters, role: Barista, startsAt: "2026-10-19T08:00:00Z", endsAt: "2026-10-19T16:00:00Z" }
        "404": { $ref: "#/components/responses/Error" }

  /shifts/{shiftId}/replacements:
    get:
      summary: Candidates sorted by relevance, best first
      parameters:
        - { $ref: "#/components/parameters/ShiftId" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidatePage" }
              example:
                items:
                  - { workerId: w_7, name: Jonas Willems, role: Barista, score: 87, contact: none }
                  - { workerId: w_3, name: Mila Claes, role: Barista, score: 74, contact: sent }
                nextCursor: null
        "404": { $ref: "#/components/responses/Error" }

  /shifts/{shiftId}/replacements/{workerId}/contact:
    post:
      summary: Message the worker asking if they can take the shift ("Contact" button)
      parameters:
        - { $ref: "#/components/parameters/ShiftId" }
        - { $ref: "#/components/parameters/WorkerId" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  allOf: [ { $ref: "#/components/schemas/Channel" } ]
                  description: Defaults to the worker's preferred channel.
            example: { channel: whatsapp }
      responses:
        "201":
          description: Message queued/sent
          content:
            application/json:
              schema:
                type: object
                required: [contact]
                properties:
                  contact: { $ref: "#/components/schemas/ContactStatus" }
              example: { contact: sent }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }   # ALREADY_CONTACTED
        "422": { $ref: "#/components/responses/Error" }   # CHANNEL_UNAVAILABLE

  /shifts/{shiftId}/contacts:
    get:
      summary: Contact status per worker for this shift (optional, for polling)
      parameters:
        - { $ref: "#/components/parameters/ShiftId" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactStatusPage" }
              example:
                items:
                  - { workerId: w_7, contact: accepted }
                  - { workerId: w_3, contact: sent }
                nextCursor: null
        "404": { $ref: "#/components/responses/Error" }

  /workers/{workerId}/contact-info:
    get:
      summary: Contact details ("Show contact info" button)
      parameters: [ { $ref: "#/components/parameters/WorkerId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactInfo" }
              example:
                { phone: "+32 470 12 34 56", email: jonas@example.com, channels: [whatsapp, sms] }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  # ---------- Workers ----------
  /workers:
    get:
      summary: Paginated list of all workers with search (Workers page)
      parameters:
        - name: search
          in: query
          description: Case-insensitive partial match on name. Omit for the full list.
          schema: { type: string }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerRowPage" }
              example:
                items:
                  - { workerId: w_7, name: Jonas Willems, role: Barista }
                nextCursor: abc

  /workers/{workerId}:
    get:
      summary: Worker details (fetched when a row is expanded)
      parameters: [ { $ref: "#/components/parameters/WorkerId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerDetail" }
              example:
                workerId: w_7
                name: Jonas Willems
                role: Barista
                qualifications: [Espresso machine, First aid]
                salary: 2400
                priority: 0.8
                normalWorkHours: 32
                completedHours: 22
                phone: "+32 470 12 34 56"
                email: jonas@example.com
                channels: [whatsapp, sms]
                version: 4
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Edit worker; creates a new stored version
      description: Send only the fields that changed.
      parameters: [ { $ref: "#/components/parameters/WorkerId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerUpdate" }
            example: { salary: 2600, priority: 0.9 }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version: { type: integer }
              example: { version: 5 }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }   # VALIDATION_ERROR

  # ---------- History ----------
  /workers/{workerId}/history:
    get:
      summary: Edit history of a worker, newest first (History page)
      parameters:
        - { $ref: "#/components/parameters/WorkerId" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoryPage" }
              example:
                items:
                  - version: 5
                    editedAt: "2026-10-19T09:12:00Z"
                    editedBy: Maria Dubois
                    changes:
                      - { field: salary, from: 2400, to: 2600 }
                      - { field: priority, from: 0.8, to: 0.9 }
                nextCursor: abc
        "404": { $ref: "#/components/responses/Error" }

components:
  parameters:
    ShiftId:  { name: shiftId,  in: path, required: true, schema: { type: string } }
    WorkerId: { name: workerId, in: path, required: true, schema: { type: string } }
    Limit:    { name: limit,    in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
    Cursor:   { name: cursor,   in: query, description: "nextCursor from the previous page", schema: { type: string } }

  responses:
    Error:
      description: Error (HTTP status + code)
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string, example: SHIFT_NOT_FOUND }

  schemas:
    Channel:
      type: string
      enum: [sms, whatsapp, telegram, viber, email, phone_call]

    ContactStatus:
      type: string
      enum: [none, sent, accepted, declined, no_response]

    # ----- page wrappers -----
    CurrentShiftPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CurrentShift" } }
        nextCursor: { type: string, nullable: true }
    CalendarShiftPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CalendarShift" } }
        nextCursor: { type: string, nullable: true }
    CandidatePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Candidate" } }
        nextCursor: { type: string, nullable: true }
    ContactStatusPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            type: object
            required: [workerId, contact]
            properties:
              workerId: { type: string }
              contact: { $ref: "#/components/schemas/ContactStatus" }
        nextCursor: { type: string, nullable: true }
    WorkerRowPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/WorkerRow" } }
        nextCursor: { type: string, nullable: true }
    HistoryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/HistoryEntry" } }
        nextCursor: { type: string, nullable: true }

    # ----- items -----
    CurrentShift:
      type: object
      required: [shiftId, workerId, name, role, endsAt]
      properties:
        shiftId:  { type: string }
        workerId: { type: string }
        name:     { type: string }
        role:     { type: string }
        endsAt:   { type: string, format: date-time }

    CalendarShift:
      type: object
      required: [shiftId, name, startsAt, endsAt]
      properties:
        shiftId:  { type: string }
        name:     { type: string }
        startsAt: { type: string, format: date-time }
        endsAt:   { type: string, format: date-time }

    ShiftDetail:
      allOf:
        - $ref: "#/components/schemas/CalendarShift"
        - type: object
          required: [role]
          properties:
            role: { type: string }

    Candidate:
      type: object
      required: [workerId, name, role, score, contact]
      properties:
        workerId: { type: string }
        name:     { type: string }
        role:     { type: string }
        score:    { type: integer, minimum: 0, maximum: 100 }
        contact:  { $ref: "#/components/schemas/ContactStatus" }

    ContactInfo:
      type: object
      required: [channels]
      properties:
        phone:    { type: string, nullable: true }
        email:    { type: string, format: email, nullable: true }
        channels: { type: array, items: { $ref: "#/components/schemas/Channel" } }

    WorkerRow:
      type: object
      required: [workerId, name, role]
      properties:
        workerId: { type: string }
        name:     { type: string }
        role:     { type: string }

    WorkerDetail:
      type: object
      required: [workerId, name, role, qualifications, salary, priority, normalWorkHours, completedHours, channels, version]
      properties:
        workerId:        { type: string }
        name:            { type: string }
        role:            { type: string }
        qualifications:  { type: array, items: { type: string } }
        salary:          { type: number }
        priority:        { type: number, minimum: 0, maximum: 1, description: "Higher = more likely to be picked / to respond" }
        normalWorkHours: { type: number }
        completedHours:  { type: number, readOnly: true }
        phone:           { type: string, nullable: true }
        email:           { type: string, format: email, nullable: true }
        channels:        { type: array, items: { $ref: "#/components/schemas/Channel" } }
        version:         { type: integer, readOnly: true }

    WorkerUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:            { type: string }
        role:            { type: string }
        qualifications:  { type: array, items: { type: string } }
        salary:          { type: number }
        priority:        { type: number, minimum: 0, maximum: 1 }
        normalWorkHours: { type: number }
        phone:           { type: string, nullable: true }
        email:           { type: string, format: email, nullable: true }
        channels:        { type: array, items: { $ref: "#/components/schemas/Channel" } }

    HistoryEntry:
      type: object
      required: [version, editedAt, editedBy, changes]
      properties:
        version:  { type: integer }
        editedAt: { type: string, format: date-time }
        editedBy: { type: string }
        changes:
          type: array
          description: Only fields changed in this version.
          items:
            type: object
            required: [field, from, to]
            properties:
              field: { type: string }
              from:  { nullable: true, description: "Previous value (any JSON type)" }
              to:    { nullable: true, description: "New value (any JSON type)" }
